services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: carteira
      POSTGRES_USER: carteira
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carteira -d carteira"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    image: minha-carteira
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://carteira:${POSTGRES_PASSWORD}@postgres:5432/carteira
      CACHE_DIR: /data/cache
      # DB_PATH mantido para fallback local sem PostgreSQL
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    command: >
      python3 -m uvicorn carteira_clean_web.backend.api.main:app
      --host 0.0.0.0 --port 8000 --log-level warning
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s

  frontend:
    image: minha-carteira
    restart: unless-stopped
    env_file: .env
    environment:
      API_BASE_URL: http://backend:8000
      DATABASE_URL: postgresql+psycopg2://carteira:${POSTGRES_PASSWORD}@postgres:5432/carteira
      CACHE_DIR: /data/cache
    volumes:
      - ./data:/data
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    command: >
      python3 -m streamlit run carteira_clean_web/frontend/app.py
      --server.port 8501 --server.headless true --server.address 0.0.0.0

  mcp:
    image: minha-carteira
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://carteira:${POSTGRES_PASSWORD}@postgres:5432/carteira
      CACHE_DIR: /data/cache
    volumes:
      - ./data:/data
    command: >
      python3 -m carteira_clean_web.backend.mcp.server
    depends_on:
      backend:
        condition: service_healthy

  cron:
    image: minha-carteira
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://carteira:${POSTGRES_PASSWORD}@postgres:5432/carteira
      CACHE_DIR: /data/cache
    volumes:
      - ./data:/data
    command: >
      python3 -m carteira_clean_web.backend.scripts.cron_runner --serve
    depends_on:
      backend:
        condition: service_healthy

  nextjs:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://minhacarteira.duckdns.org/api/v1
    restart: unless-stopped
    env_file: .env
    environment:
      NEXTAUTH_URL: https://minhacarteira.duckdns.org
      API_BASE_URL: http://backend:8000/api/v1
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - mcp
      - nextjs

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
