name: Deploy to GCP VM

on:
  push:
    branches: [master]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write   # obrigatório para Workload Identity Federation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar no GCP (Workload Identity — sem chave JSON)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/47407395873/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-deploy@project-e64490eb-e084-4e83-ac5.iam.gserviceaccount.com

      - name: Instalar gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: project-e64490eb-e084-4e83-ac5

      - name: Injetar secrets no .env da VM
        env:
          BRAVE_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: |
          gcloud compute ssh carteira-clean \
            --zone=us-central1-a \
            --tunnel-through-iap \
            --quiet \
            --command="ENV_FILE=/home/marciiinho84/carteira-web/.env && \
              sudo touch \$ENV_FILE && \
              if sudo grep -q '^BRAVE_API_KEY=' \$ENV_FILE; then \
                sudo sed -i 's|^BRAVE_API_KEY=.*|BRAVE_API_KEY=$BRAVE_KEY|' \$ENV_FILE; \
              else \
                echo 'BRAVE_API_KEY=$BRAVE_KEY' | sudo tee -a \$ENV_FILE > /dev/null; \
              fi"

      - name: Deploy na VM via IAP tunnel
        run: |
          gcloud compute ssh carteira-clean \
            --zone=us-central1-a \
            --tunnel-through-iap \
            --quiet \
            --command="set -e && \
              sudo git -C /home/marciiinho84/carteira-web pull origin master && \
              sudo docker compose -f /home/marciiinho84/carteira-web/docker-compose.yml build && \
              sudo docker container prune -f && \
              sudo docker compose -f /home/marciiinho84/carteira-web/docker-compose.yml up -d --remove-orphans && \
              echo DEPLOY_OK"
